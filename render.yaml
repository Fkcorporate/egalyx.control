services:
  - type: web
    name: controle-interne-app
    env: python
    region: frankfurt  # ou london, us-east, etc.
    buildCommand: |
      pip install -r requirements.txt
    # Un seul processus (plusieurs fils) : les tâches planifiées (alertes de 8 h, résumé hebdomadaire,
    # sauvegarde de nuit, relevé des KRI) démarrent dans chaque processus ; avec 4 processus elles
    # s'exécuteraient 4 fois (e-mails en quadruple).
    startCommand: gunicorn app:app --workers=1 --threads=8 --worker-class=gthread --timeout=120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: controle_interne_db
          property: connectionString
      - key: RENDER
        value: true
      - key: EGALYX_DONNEES      # fichiers déposés (logos, preuves, pièces jointes) sur le disque persistant
        value: /var/data
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USE_TLS
        value: true
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 10

databases:
  - name: controle_interne_db
    databaseName: controle_interne
    user: controle_interne_user
    region: frankfurt
    plan: free  # Changer en "starter" ou "professional" pour production
    ipAllowList: []  # Autoriser toutes les IP