# Egalyx Control — installation chez un client (on-premise) : application + PostgreSQL + Nginx (HTTPS).
# Avant le premier lancement :  cp deploiement/on-premise/env.exemple .env   puis remplissez .env
# Lancement :                   docker compose up -d --build
# Guide complet :               deploiement/on-premise/GUIDE_INSTALLATION.md
name: egalyx

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-egalyx}
      POSTGRES_USER: ${POSTGRES_USER:-egalyx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-egalyx} -d ${POSTGRES_DB:-egalyx}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # la base n'est jamais exposée hors du serveur

  web:
    build: .
    image: egalyx-control:latest
    restart: unless-stopped
    env_file: .env
    environment:
      EGALYX_PRODUCTION: "1"
      EGALYX_DONNEES: /donnees
      EGALYX_DOSSIER_SAUVEGARDES: /sauvegardes
      DATABASE_URL: postgresql://${POSTGRES_USER:-egalyx}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-egalyx}
    volumes:
      - donnees:/donnees
      - ./sauvegardes:/sauvegardes
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PORT_HTTP:-80}:80"
      - "${PORT_HTTPS:-443}:443"
    volumes:
      - ./deploiement/on-premise/nginx/egalyx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploiement/on-premise/certificats:/etc/nginx/certs:ro
    depends_on:
      - web

volumes:
  db_data:
  donnees:
