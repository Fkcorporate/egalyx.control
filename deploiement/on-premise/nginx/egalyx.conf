# Egalyx Control — Nginx devant l'application (HTTPS).
# Certificat du client : deploiement/on-premise/certificats/egalyx.crt et egalyx.key
# (pour un essai : deploiement/on-premise/scripts/certificat_test.sh)

server_tokens off;

server {
    listen 80;
    server_name _;
    location = /health { proxy_pass http://web:8000/health; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/egalyx.crt;
    ssl_certificate_key /etc/nginx/certs/egalyx.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 50m;           # pièces jointes, preuves d'audit

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 180s;         # rapports PDF volumineux
        proxy_send_timeout 180s;
    }
}
