<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>{{ r.titre }} — {{ organisation }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <style>
    @page { size: A4 landscape; margin: 10mm; }
    body { font-size: 12px; background: #fff; }
    .cp-imp-entete { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid var(--bs-primary); padding-bottom: 6px; margin-bottom: 10px; }
    .cp-imp-entete h1 { font-size: 18px; font-weight: 700; margin: 0; }
    .cp-imp-entete .text-secondary { font-size: 11px; }
    .cp-imp-barre { display: flex; gap: 8px; margin-bottom: 10px; }
    .cp-tuile { break-inside: avoid; }
    @media print { .cp-imp-barre { display: none; } body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
  </style>
</head>
<body class="p-3">
  <div class="cp-imp-barre">
    <button class="btn btn-sm btn-primary" onclick="window.print()"><i class="fas fa-print me-1"></i>Imprimer / enregistrer en PDF</button>
    <span class="small text-secondary align-self-center">Choisissez « Enregistrer au format PDF » comme imprimante pour obtenir un fichier.</span>
  </div>
  <div class="cp-imp-entete">
    <div><h1>{{ r.titre }}</h1><div class="text-secondary">{{ organisation }}{% if vue == 'risques' %} · vue risques{% elif vue == 'audit' %} · couverture d'audit{% endif %}</div></div>
    <div class="text-secondary">Édition du {{ aujourdhui }}</div>
  </div>
  {% include "egalyx/_carto_processus_carte.html" %}
  <script>window.addEventListener('load', function () { setTimeout(function () { window.cpDessinerLiens && window.cpDessinerLiens(); }, 150); });</script>
</body>
</html>
