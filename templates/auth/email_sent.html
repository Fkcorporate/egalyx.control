<!DOCTYPE html>
<html lang="fr" data-bs-theme="light" id="html-theme">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email envoyé - Egalyx Control</title>
    
    <!-- Mêmes styles que les autres pages -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Mêmes styles que les pages précédentes */
        /* ... copier les styles communs ... */
        
        .success-icon {
            font-size: 48px;
            color: var(--accent-gold);
            margin-bottom: 24px;
        }
        
        .email-highlight {
            background: linear-gradient(135deg, var(--navy-dark), var(--corporate-blue));
            color: white;
            padding: 8px 16px;
            border-radius: 30px;
            display: inline-block;
            margin: 16px 0;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- Switch thème -->
    <div class="theme-switch-container">
        <div class="theme-switch" id="themeSwitch">
            <i class="fas fa-sun theme-icon sun"></i>
            <i class="fas fa-moon theme-icon moon"></i>
        </div>
    </div>

    <!-- Arrière-plan -->
    <div class="background-elements">
        <div class="line vertical-line"></div>
        <div class="line vertical-line"></div>
        <div class="line vertical-line"></div>
        <div class="line horizontal-line"></div>
        <div class="line horizontal-line"></div>
    </div>

    <!-- Conteneur principal -->
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="icon-circle">
                    <i class="fas fa-check"></i>
                </div>
                
                <h1><span>Email</span> envoyé !</h1>
                
                <div class="success-icon">
                    <i class="fas fa-paper-plane"></i>
                </div>
                
                <p class="subtitle">
                    Un email a été envoyé à l'adresse
                </p>
                
                <div class="email-highlight">
                    {{ email }}
                </div>
                
                <p class="subtitle" style="margin-top: 20px;">
                    Cliquez sur le lien contenu dans cet email pour réinitialiser votre mot de passe.
                    Le lien est valable 1 heure.
                </p>
            </div>

            <div class="auth-footer">
                <a href="{{ url_for('login_fullscreen') }}" class="back-link" style="margin-bottom: 20px;">
                    <i class="fas fa-arrow-left"></i> Retour à la connexion
                </a>
                
                <div class="security-note">
                    <i class="fas fa-shield-alt"></i>
                    Si vous ne recevez pas l'email, vérifiez vos spams
                </div>
            </div>
        </div>
    </div>

    <script>
        // Même script de thème que les autres pages
        const COLORS = {
            light: 'linear-gradient(135deg, #F0F4F8 0%, #E6EEF5 100%)',
            dark: 'linear-gradient(135deg, #0A2647 0%, #1A3F5C 100%)'
        };

        function setTheme(theme) {
            const html = document.documentElement;
            const body = document.body;
            const themeSwitch = document.getElementById('themeSwitch');
            
            if (theme === 'dark') {
                html.setAttribute('data-theme', 'dark');
                html.setAttribute('data-bs-theme', 'dark');
                body.style.background = COLORS.dark;
                body.style.backgroundColor = '#0A2647';
                if (themeSwitch) themeSwitch.classList.add('active');
                localStorage.setItem('egalyx-theme', 'dark');
            } else {
                html.removeAttribute('data-theme');
                html.setAttribute('data-bs-theme', 'light');
                body.style.background = COLORS.light;
                body.style.backgroundColor = '#F0F4F8';
                if (themeSwitch) themeSwitch.classList.remove('active');
                localStorage.setItem('egalyx-theme', 'light');
            }
        }

        (function init() {
            const savedTheme = localStorage.getItem('egalyx-theme') || 'light';
            setTheme(savedTheme);
            
            const themeSwitch = document.getElementById('themeSwitch');
            if (themeSwitch) {
                themeSwitch.addEventListener('click', function() {
                    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                    setTheme(isDark ? 'light' : 'dark');
                });
            }
        })();
    </script>
</body>
</html>
