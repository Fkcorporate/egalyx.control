<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>{{ ctx.objet }}</title></head>
<body style="margin:0;padding:0;background:#eef2f7;font-family:Helvetica,Arial,sans-serif;color:#0f172a;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#eef2f7;padding:24px 0;">
<tr><td align="center">
  <table role="presentation" width="680" cellpadding="0" cellspacing="0" style="max-width:680px;width:100%;background:#ffffff;border-radius:8px;overflow:hidden;">
    <tr><td style="background:{{ couleur }};padding:14px 28px;color:#ffffff;font-size:14px;font-weight:700;">
      Lettre de mission · {{ ctx.reference }}</td></tr>
    <tr><td style="padding:24px 28px 8px;font-size:14px;line-height:1.6;white-space:pre-line;">{{ message }}</td></tr>
    <tr><td style="padding:8px 28px 4px;"><div style="font-size:12px;color:#64748b;border-top:1px solid #e2e8f0;padding-top:12px;">
      La lettre figure ci-dessous et en pièce jointe (PDF).</div></td></tr>
    <tr><td style="padding:12px 28px 28px;"><div style="border:1px solid #e2e8f0;border-radius:6px;padding:24px;">{{ lettre_html|safe }}</div></td></tr>
    <tr><td style="padding:12px 28px 20px;font-size:11px;color:#94a3b8;text-align:center;">
      {{ ctx.organisation }} — message envoyé depuis Egalyx. Pour toute question, répondez simplement à ce message.</td></tr>
  </table>
</td></tr></table>
</body></html>
