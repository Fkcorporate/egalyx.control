{#- Générateur de mot de passe sûr (crypto.getRandomValues, tirage sans biais, mélange Fisher-Yates).
    Remplace l'ancien tirage non cryptographique du navigateur. -#}
<script>
window.egMotDePasseSur = window.egMotDePasseSur || function (longueur, opts) {
  opts = Object.assign({majuscules: true, chiffres: true, speciaux: true}, opts || {});
  longueur = Math.max(12, Math.min(64, parseInt(longueur, 10) || 16));
  const c = window.crypto || window.msCrypto;
  if (!c || !c.getRandomValues) throw new Error('Générateur sûr indisponible dans ce navigateur');
  const hasard = (n) => {                       // entier uniforme dans [0, n)
    const max = Math.floor(0x100000000 / n) * n, t = new Uint32Array(1);
    do { c.getRandomValues(t); } while (t[0] >= max);
    return t[0] % n;
  };
  const familles = ['abcdefghijkmnopqrstuvwxyz'];  // sans l, I, O, 0, 1 : évite les confusions à la lecture
  if (opts.majuscules) familles.push('ABCDEFGHJKLMNPQRSTUVWXYZ');
  if (opts.chiffres) familles.push('23456789');
  if (opts.speciaux) familles.push('!@#$%^&*()-_=+[]{};:,.?');
  const tous = familles.join('');
  const car = familles.map(f => f[hasard(f.length)]);   // au moins un de chaque famille demandée
  while (car.length < longueur) car.push(tous[hasard(tous.length)]);
  for (let i = car.length - 1; i > 0; i--) { const j = hasard(i + 1); [car[i], car[j]] = [car[j], car[i]]; }
  return car.join('');
};
</script>
