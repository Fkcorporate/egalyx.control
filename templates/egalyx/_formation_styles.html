{# Styles communs des écrans de formation (lecteur, « Mes formations »). Couleur du thème : --fc (foncée), --fc2 (claire). #}
<style>
  .fx { --fc: #1D4ED8; --fc2: #60A5FA; --fx-encre: #0f172a; --fx-doux: #64748b; --fx-ligne: #e2e8f0; --fx-fond: #f8fafc; }
  [data-bs-theme="dark"] .fx { --fx-encre: #e2e8f0; --fx-doux: #94a3b8; --fx-ligne: #334155; --fx-fond: #0f172a; }

  /* ---------- couverture (bandeau et cartes) ---------- */
  .fx-couv { position: relative; isolation: isolate; overflow: hidden; color: #fff;
    background: radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--fc2) 70%, transparent) 0%, transparent 58%),
                linear-gradient(135deg, var(--fc) 0%, color-mix(in srgb, var(--fc) 70%, #020617) 100%); }
  .fx-couv::after { content: ""; position: absolute; inset: 0; z-index: -1; opacity: .18;
    background-image: radial-gradient(#fff 1px, transparent 1.2px); background-size: 18px 18px;
    -webkit-mask-image: linear-gradient(115deg, transparent 35%, #000 100%); mask-image: linear-gradient(115deg, transparent 35%, #000 100%); }
  .fx-puce { display: inline-flex; align-items: center; gap: .45rem; padding: .3rem .7rem; border-radius: 999px; font-size: .78rem; font-weight: 600;
    background: rgba(255,255,255,.16); color: #fff; backdrop-filter: blur(4px); }

  /* ---------- bandeau du lecteur ---------- */
  .fx-hero { border-radius: 18px; padding: clamp(1.25rem, 3vw, 2rem) clamp(1.25rem, 3vw, 2.25rem) 0; margin-bottom: 1.5rem; }
  .fx-hero-grille { display: grid; grid-template-columns: minmax(0, 1fr) clamp(180px, 26vw, 300px); gap: 1.5rem; align-items: end; }
  .fx-retour { color: rgba(255,255,255,.85); font-size: .88rem; text-decoration: none; display: inline-flex; gap: .4rem; align-items: center; margin-bottom: .9rem; }
  .fx-retour:hover, .fx-retour:focus-visible { color: #fff; text-decoration: underline; }
  .fx-hero h1 { font-size: clamp(1.6rem, 3.4vw, 2.35rem); font-weight: 750; line-height: 1.12; letter-spacing: -.015em; margin: .7rem 0 .45rem; color: #fff; }
  .fx-hero .fx-sous { color: rgba(255,255,255,.82); margin: 0 0 1.1rem; max-width: 46rem; }
  .fx-meta { display: flex; flex-wrap: wrap; gap: .5rem 1.2rem; font-size: .88rem; color: rgba(255,255,255,.9); margin-bottom: 1.3rem; }
  .fx-meta span { display: inline-flex; gap: .4rem; align-items: center; }
  .fx-dessin { width: 100%; height: auto; display: block; margin-bottom: -.4rem; filter: drop-shadow(0 12px 24px rgba(2,6,23,.25)); }
  .fx-barre { height: 6px; background: rgba(255,255,255,.2); border-radius: 999px; overflow: hidden; margin: 0 -.2rem; }
  .fx-barre > span { display: block; height: 100%; width: var(--p, 0%); background: #fff; border-radius: inherit; transition: width .5s cubic-bezier(.2,.8,.2,1); }
  .fx-hero-pied { display: flex; justify-content: space-between; font-size: .8rem; color: rgba(255,255,255,.85); padding: .55rem 0 1rem; }
  @media (max-width: 767px) {
    .fx-hero-grille { grid-template-columns: 1fr; }
    .fx-dessin { display: none; }
    .fx-hero-pied span + span { display: none; }
  }

  /* ---------- lecteur ---------- */
  .fx-lecteur { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 1.75rem; align-items: start; }
  .fx-lecteur > * { min-width: 0; }
  @media (max-width: 991px) { .fx-lecteur { grid-template-columns: 1fr; } }
  .fx-plan { position: sticky; top: 90px; }
  @media (max-width: 991px) {
    .fx-plan { position: static; margin: 0 -.25rem; }
    .fx-plan p { display: none; }
    .fx-plan ol { display: flex; gap: .4rem; overflow-x: auto; padding: .25rem .25rem .6rem; scroll-snap-type: x proximity; }
    .fx-plan li { flex: none; scroll-snap-align: start; }
    .fx-plan button { width: auto; white-space: nowrap; border: 1px solid var(--fx-ligne); border-radius: 999px; padding: .35rem .8rem .35rem .4rem; }
  }
  .fx-plan p { font-size: .78rem; font-weight: 650; color: var(--fx-doux); margin: 0 0 .6rem; }
  .fx-plan ol { list-style: none; margin: 0; padding: 0; counter-reset: fx; }
  .fx-plan button { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 26px 1fr; gap: .6rem; align-items: center;
    width: 100%; padding: .5rem .55rem; border-radius: 10px; font-size: .9rem; color: var(--fx-doux); line-height: 1.3; }
  .fx-plan button:hover { background: var(--fx-fond); color: var(--fx-encre); }
  .fx-plan button:focus-visible { outline: 2px solid var(--fc); outline-offset: 1px; }
  .fx-plan .fx-num { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: .75rem; font-weight: 700;
    border: 2px solid var(--fx-ligne); color: var(--fx-doux); background: var(--bs-body-bg); transition: all .25s; }
  .fx-plan [aria-current="step"] { background: color-mix(in srgb, var(--fc) 9%, transparent); color: var(--fx-encre); font-weight: 600; }
  .fx-plan [aria-current="step"] .fx-num { border-color: var(--fc); color: var(--fc); }
  .fx-plan .vu .fx-num { background: var(--fc); border-color: var(--fc); color: #fff; }
  .fx-plan .vu .fx-num::before { content: "\2713"; font-size: .8rem; }
  .fx-plan .vu .fx-num span { display: none; }

  .fx-scene { background: var(--bs-body-bg); border: 1px solid var(--fx-ligne); border-radius: 18px; padding: clamp(1.25rem, 3.5vw, 2.6rem);
    box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 12px 32px -18px rgba(15,23,42,.18); min-height: 420px; }
  .fx-etape + .fx-etape { margin-top: 2.5rem; padding-top: 2rem; border-top: 1px solid var(--fx-ligne); }
  .fx-js .fx-etape + .fx-etape { margin-top: 0; padding-top: 0; border-top: 0; }
  .fx-js .fx-etape[hidden] { display: none; }
  .fx-js .fx-etape.entre { animation: fx-entree .42s cubic-bezier(.2,.8,.2,1) both; }
  .fx-js .fx-etape.entre-arriere { animation: fx-entree-arriere .42s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes fx-entree { from { opacity: 0; transform: translateX(26px); } to { opacity: 1; transform: none; } }
  @keyframes fx-entree-arriere { from { opacity: 0; transform: translateX(-26px); } to { opacity: 1; transform: none; } }
  .fx-kicker { font-size: .78rem; font-weight: 700; color: var(--fc); margin: 0 0 .35rem; }
  .fx-etape h2 { font-size: clamp(1.4rem, 2.6vw, 1.85rem); font-weight: 750; letter-spacing: -.01em; color: var(--fx-encre); margin: 0 0 1.2rem; }
  .fx-texte { max-width: 44rem; font-size: 1.04rem; line-height: 1.75; color: var(--fx-encre); }
  .fx-texte h3 { font-size: 1.1rem; font-weight: 700; margin: 1.6rem 0 .5rem; }
  .fx-texte ul, .fx-texte ol { padding-left: 1.35rem; margin-bottom: 1.1rem; }
  .fx-texte li { margin-bottom: .4rem; }
  .fx-texte li::marker { color: var(--fc); font-weight: 700; }
  .fx-texte strong { color: var(--fx-encre); }
  .fx-video { position: relative; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: #000; max-width: 46rem; }
  .fx-video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  /* encadrés et images du contenu */
  .fe { position: relative; margin: 1.4rem 0; padding: 1rem 1.15rem 1rem 3.1rem; border-radius: 14px; background: var(--fx-fond); border: 1px solid var(--fx-ligne); }
  .fe::before { position: absolute; left: 1rem; top: 1rem; width: 1.4rem; height: 1.4rem; border-radius: 50%; display: grid; place-items: center;
    font: 700 .82rem/1 system-ui, sans-serif; color: #fff; }
  .fe p { margin: 0; }
  .fe .fe-titre { font-weight: 700; margin-bottom: .2rem; font-size: .92rem; }
  .fe-retenir { background: color-mix(in srgb, var(--fc) 8%, var(--bs-body-bg)); border-color: color-mix(in srgb, var(--fc) 28%, transparent); }
  .fe-retenir::before { content: "\2605"; background: var(--fc); }
  .fe-retenir .fe-titre { color: var(--fc); }
  .fe-attention { background: color-mix(in srgb, #dc2626 7%, var(--bs-body-bg)); border-color: color-mix(in srgb, #dc2626 30%, transparent); }
  .fe-attention::before { content: "!"; background: #dc2626; }
  .fe-attention .fe-titre { color: #b91c1c; }
  .fe-exemple::before { content: "\201C"; background: #0f766e; font-size: 1.1rem; padding-top: .3rem; }
  .fe-exemple .fe-titre { color: #0f766e; }
  .fe-savoir::before { content: "i"; background: #475569; font-style: italic; }
  .fe-image { margin: 1.5rem 0; }
  .fe-image img { max-width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--fx-ligne); }
  .fe-image figcaption { font-size: .85rem; color: var(--fx-doux); margin-top: .45rem; }

  /* navigation entre étapes */
  .fx-nav { display: none; justify-content: space-between; align-items: center; gap: 1rem; margin-top: 2.2rem; padding-top: 1.2rem; border-top: 1px solid var(--fx-ligne); }
  .fx-js .fx-nav { display: flex; }
  .fx-nav .fx-pos { font-size: .85rem; color: var(--fx-doux); }
  .fx-btn { display: inline-flex; align-items: center; gap: .5rem; padding: .62rem 1.15rem; border-radius: 12px; font-weight: 650; border: 1px solid transparent;
    background: var(--fc); color: #fff; cursor: pointer; transition: transform .15s, box-shadow .15s, opacity .15s; }
  .fx-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 18px -8px color-mix(in srgb, var(--fc) 70%, transparent); color: #fff; }
  .fx-btn:focus-visible { outline: 3px solid color-mix(in srgb, var(--fc) 40%, transparent); outline-offset: 2px; }
  .fx-btn:disabled { opacity: .45; cursor: not-allowed; }
  .fx a.fx-btn, .fx a.fx-btn:hover { text-decoration: none; }
  .fx h2[tabindex="-1"]:focus, .fx legend[tabindex="-1"]:focus { outline: none; }
  .fx-btn.secondaire { background: transparent; color: var(--fx-encre); border-color: var(--fx-ligne); }
  .fx-btn.secondaire:hover:not(:disabled) { box-shadow: none; background: var(--fx-fond); color: var(--fx-encre); }

  /* quiz */
  .fx-q { border: 0; padding: 0; margin: 0 0 1.6rem; }
  .fx-js .fx-quiz-pas .fx-q { display: none; }
  .fx-js .fx-quiz-pas .fx-q.actif { display: block; animation: fx-entree .35s cubic-bezier(.2,.8,.2,1) both; }
  .fx-q legend { font-size: 1.12rem; font-weight: 700; color: var(--fx-encre); margin-bottom: .2rem; float: left; width: 100%; padding: 0; }
  .fx-q legend + * { clear: left; }
  .fx-q .fx-aide { font-size: .84rem; color: var(--fx-doux); margin: 0 0 .8rem; }
  .fx-choix { display: grid; gap: .6rem; }
  .fx-choix label { display: grid; grid-template-columns: 22px 1fr auto; gap: .8rem; align-items: center; padding: .85rem 1rem; border-radius: 12px;
    border: 1.5px solid var(--fx-ligne); cursor: pointer; transition: border-color .15s, background .15s, transform .15s; line-height: 1.4; }
  .fx-choix label:hover { border-color: color-mix(in srgb, var(--fc) 45%, var(--fx-ligne)); background: var(--fx-fond); }
  .fx-choix input { width: 20px; height: 20px; margin: 0; accent-color: var(--fc); }
  .fx-choix input:focus-visible { outline: 2px solid var(--fc); outline-offset: 2px; }
  .fx-choix label:has(input:checked) { border-color: var(--fc); background: color-mix(in srgb, var(--fc) 7%, var(--bs-body-bg)); }
  .fx-choix .bonne { font-size: .74rem; font-weight: 700; color: #15803d; background: #dcfce7; padding: .15rem .5rem; border-radius: 999px; }
  .fx-q.juste .fx-verdict { color: #15803d; } .fx-q.faux .fx-verdict { color: #b91c1c; }
  .fx-q.faux .fx-choix label:has(input:checked) { border-color: #f87171; background: color-mix(in srgb, #ef4444 6%, var(--bs-body-bg)); }
  .fx-verdict { font-size: .88rem; font-weight: 650; margin-top: .6rem; }
  .fx-explication { font-size: .9rem; color: var(--fx-doux); margin-top: .35rem; }
  .fx-points { display: none; gap: .4rem; margin-bottom: 1.4rem; }
  .fx-js .fx-quiz-pas .fx-points { display: flex; }
  .fx-points span { height: 6px; flex: 1; border-radius: 999px; background: var(--fx-ligne); transition: background .3s; }
  .fx-points span.fait { background: color-mix(in srgb, var(--fc) 55%, var(--fx-ligne)); }
  .fx-points span.actif { background: var(--fc); }
  .fx-quiz-actions { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  .fx-js .fx-quiz-pas .fx-envoi { display: none; }
  .fx-js .fx-quiz-pas.fin .fx-envoi { display: inline-flex; }
  .fx-js .fx-quiz-pas.fin .fx-suivante { display: none; }
  .fx-suivante, .fx-precedente-q { display: none; }
  .fx-js .fx-quiz-pas .fx-suivante, .fx-js .fx-quiz-pas .fx-precedente-q { display: inline-flex; }

  /* résultat */
  .fx-resultat { position: relative; display: grid; grid-template-columns: auto 1fr; gap: 1.6rem; align-items: center; padding: 1.5rem;
    border-radius: 16px; margin-bottom: 2rem; overflow: hidden; }
  .fx-resultat.ok { background: linear-gradient(135deg, #f0fdf4, #ecfeff); border: 1px solid #bbf7d0; }
  .fx-resultat.ko { background: linear-gradient(135deg, #fffbeb, #fff7ed); border: 1px solid #fde68a; }
  [data-bs-theme="dark"] .fx-resultat.ok { background: #052e16; border-color: #166534; }
  [data-bs-theme="dark"] .fx-resultat.ko { background: #2a1d05; border-color: #854d0e; }
  .fx-resultat h2 { font-size: 1.45rem; margin: 0 0 .35rem; }
  .fx-resultat p { margin: 0 0 .9rem; color: var(--fx-doux); }
  .fx-anneau { width: 132px; height: 132px; position: relative; }
  .fx-anneau svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .fx-anneau circle { fill: none; stroke-width: 11; }
  .fx-anneau .fond { stroke: rgba(15,23,42,.08); }
  .fx-anneau .val { stroke-linecap: round; stroke-dasharray: 327; stroke-dashoffset: calc(327 - 327 * var(--s, 0) / 100);
    transition: stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1); }
  .ok .fx-anneau .val { stroke: #16a34a; } .ko .fx-anneau .val { stroke: #d97706; }
  .fx-anneau b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 1.9rem; font-weight: 800; color: var(--fx-encre); }
  .fx-anneau b small { font-size: .9rem; font-weight: 700; }
  .fx-confettis { position: absolute; inset: 0; pointer-events: none; }
  @media (max-width: 575px) { .fx-resultat { grid-template-columns: 1fr; justify-items: start; } }

  /* ---------- « Mes formations » ---------- */
  .fm-tete { border-radius: 18px; padding: clamp(1.4rem, 3vw, 2.2rem); margin-bottom: 1.8rem; --fc: #0f2a4a; --fc2: #3b82f6; }
  .fm-tete h1 { font-size: clamp(1.7rem, 3.2vw, 2.3rem); font-weight: 750; margin: 0 0 .3rem; color: #fff; letter-spacing: -.015em; }
  .fm-tete p { color: rgba(255,255,255,.8); margin: 0 0 1.4rem; }
  .fm-chiffres { display: flex; flex-wrap: wrap; gap: .8rem; }
  .fm-chiffres div { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18); border-radius: 14px; padding: .75rem 1.1rem; min-width: 150px; }
  .fm-chiffres b { display: block; font-size: 1.6rem; font-weight: 800; line-height: 1.1; color: #fff; }
  .fm-chiffres span { font-size: .8rem; color: rgba(255,255,255,.82); }
  .fm-section { font-size: 1.05rem; font-weight: 700; color: var(--fx-encre); margin: 0 0 1rem; display: flex; gap: .6rem; align-items: center; }
  .fm-section .compte { font-size: .8rem; font-weight: 700; color: var(--fx-doux); background: var(--fx-fond); border: 1px solid var(--fx-ligne); padding: .1rem .55rem; border-radius: 999px; }
  .fm-grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.2rem; margin-bottom: 2.4rem; }
  .fm-carte { display: flex; flex-direction: column; border: 1px solid var(--fx-ligne); border-radius: 18px; overflow: hidden; background: var(--bs-body-bg);
    transition: transform .2s, box-shadow .2s; }
  .fm-carte:hover { transform: translateY(-3px); box-shadow: 0 18px 36px -20px rgba(15,23,42,.35); }
  .fm-carte:focus-within { box-shadow: 0 0 0 3px color-mix(in srgb, var(--fc) 35%, transparent); }
  .fm-couv { height: 150px; padding: .9rem; display: flex; justify-content: space-between; align-items: flex-start; }
  .fm-couv svg { position: absolute; right: -6%; bottom: -14%; width: 78%; height: auto; opacity: .95; transition: transform .35s cubic-bezier(.2,.8,.2,1); }
  .fm-carte:hover .fm-couv svg { transform: translateY(-4px) scale(1.03); }
  .fm-corps { padding: 1.1rem 1.15rem 1.2rem; display: flex; flex-direction: column; gap: .55rem; flex: 1; }
  .fm-corps h2 { font-size: 1.05rem; font-weight: 700; line-height: 1.3; margin: 0; color: var(--fx-encre); }
  .fm-corps .resume { font-size: .88rem; color: var(--fx-doux); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin: 0; }
  .fm-infos { display: flex; flex-wrap: wrap; gap: .4rem 1rem; font-size: .8rem; color: var(--fx-doux); }
  .fm-infos span { display: inline-flex; gap: .35rem; align-items: center; }
  .fm-pied { margin-top: auto; padding-top: .7rem; display: flex; justify-content: space-between; align-items: center; gap: .6rem; }
  .fm-etat { font-size: .76rem; font-weight: 700; padding: .25rem .6rem; border-radius: 999px; }
  .fm-etat.a_faire { background: #f1f5f9; color: #334155; } .fm-etat.en_cours { background: #dbeafe; color: #1e40af; }
  .fm-etat.en_retard { background: #fee2e2; color: #991b1b; } .fm-etat.reussi { background: #dcfce7; color: #166534; }
  .fm-delai { font-weight: 700; } .fm-delai.urgent { color: #b45309; } .fm-delai.retard { color: #b91c1c; }
  .fm-vide { text-align: center; padding: 3rem 1rem; border: 1.5px dashed var(--fx-ligne); border-radius: 18px; color: var(--fx-doux); }
  .fm-vide svg { width: 220px; max-width: 70%; height: auto; margin-bottom: 1rem; }

  @media (prefers-reduced-motion: reduce) {
    .fx *, .fx *::before, .fx *::after { animation: none !important; transition: none !important; }
  }
</style>
