{# Nouvelle apparence (paquet optionnel egalyx/apparence.py). Ajoutée par-dessus les pages : aucune page n'est réécrite. #}
{% if apparence_nouvelle is defined and apparence_nouvelle() %}
<style id="egalyx-apparence-nouvelle">
  :root {
    --fk-navy: #13294B; --fk-blue: #1D4ED8; --fk-accent: #1D4ED8; --fk-light-blue: #3B82F6;
    --primary-gradient: #13294B; --accent-gradient: #1D4ED8; --sidebar-gradient: #13294B;
    --shadow-soft: 0 1px 2px rgba(16, 24, 40, .05); --shadow-medium: 0 2px 8px rgba(16, 24, 40, .08);
    --radius-xl: 12px; --radius-lg: 12px; --radius-md: 10px;
  }
  /* En-tête et menu : à plat */
  .navbar-fk { background: #13294B !important; box-shadow: none !important; border-bottom: 1px solid rgba(255,255,255,.08); }
  .sidebar-compact, .sidebar-expanded { background: #13294B !important; }

  /* Fond et cartes */
  :root:not([data-bs-theme="dark"]) body { background: #F5F6F8 !important; }
  .fk-card, .card { border-radius: 12px !important; box-shadow: none !important; }
  :root:not([data-bs-theme="dark"]) .fk-card, :root:not([data-bs-theme="dark"]) .card { border: 1px solid #E4E7EC !important; }
  .fk-card:hover, .clickable-card:hover { transform: none !important; }
  :root:not([data-bs-theme="dark"]) h1, :root:not([data-bs-theme="dark"]) .h3 { color: #0F172A; }
  h1 .fas, h1 .fa, .h3 .fas { color: #1D4ED8; }

  /* Tableau de bord : tuiles blanches, couleur réservée aux statuts */
  .clickable-card > .fk-card-header { background: transparent !important; padding-bottom: .25rem !important; }
  :root:not([data-bs-theme="dark"]) .clickable-card > .fk-card-header { background: #FFFFFF !important; }
  .clickable-card > .fk-card-header h6 { color: #475467 !important; text-transform: none; letter-spacing: 0; font-weight: 600; }
  .clickable-card > .fk-card-header h2 { color: #0F172A !important; }
  :root[data-bs-theme="dark"] .clickable-card > .fk-card-header h2 { color: #F8FAFC !important; }
  .clickable-card > .fk-card-header .text-white-90, .clickable-card > .fk-card-header small { color: #475467 !important; }
  .clickable-card > .fk-card-header .icon-circle { background: #EEF4FF !important; }
  .clickable-card > .fk-card-header .icon-circle i { color: #1D4ED8 !important; }
  .clickable-card .fk-card-body > .d-flex.justify-content-between.mb-1,
  .clickable-card .fk-card-body > .progress { display: none !important; }
  .clickable-card .fk-card-body > .mt-3 { margin-top: 0 !important; }
  .clickable-card .fk-card-body .badge, .clickable-card .fk-card-body .fk-badge { background: #F2F4F7 !important; color: #344054 !important; }

  /* Pastilles et boutons : à plat */
  .fk-badge-danger { background: #FEE4E2 !important; color: #912018 !important; }
  .bg-gradient-info, .bg-gradient-primary { background: #1D4ED8 !important; }
  .fk-btn-primary, .btn-primary { background: #1D4ED8 !important; border-color: #1D4ED8 !important; box-shadow: none !important; }
  .fk-btn-outline { border-radius: 8px !important; }

  /* Bloc « À traiter » mis en avant */
  #aTraiter { border: 1px solid #C7D7FE !important; }
</style>
{% endif %}
