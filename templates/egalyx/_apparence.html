{# Nouvelle apparence (paquet optionnel egalyx/apparence.py). Ajoutée par-dessus les pages : aucune page n'est réécrite. #}
{% if apparence_nouvelle is defined and apparence_nouvelle() %}
<style id="egalyx-apparence-nouvelle">
  :root {
    --fk-navy: #13294B; --fk-blue: #1D4ED8; --fk-accent: #1D4ED8; --fk-light-blue: #3B82F6;
    --primary-gradient: #13294B; --accent-gradient: #1D4ED8; --sidebar-gradient: #13294B;
    --shadow-soft: 0 1px 2px rgba(16, 24, 40, .05); --shadow-medium: 0 2px 8px rgba(16, 24, 40, .08);
    --radius-xl: 12px; --radius-lg: 12px; --radius-md: 10px;
  }
  /* En-tête et menu : à plat */
  .navbar-fk { background: #13294B !important; box-shadow: none !important; border-bottom: 1px solid rgba(255,255,255,.08); }
  .sidebar-compact, .sidebar-expanded { background: #13294B !important; }

  /* Fond et cartes */
  :root:not([data-bs-theme="dark"]) body { background: #F5F6F8 !important; }
  .fk-card, .card { border-radius: 12px !important; box-shadow: none !important; }
  :root:not([data-bs-theme="dark"]) .fk-card, :root:not([data-bs-theme="dark"]) .card { border: 1px solid #E4E7EC !important; }
  .fk-card:not(.carte-couleur):hover, .clickable-card:not(.carte-couleur):hover { transform: none !important; }
  :root:not([data-bs-theme="dark"]) h1, :root:not([data-bs-theme="dark"]) .h3 { color: #0F172A; }
  h1 .fas, h1 .fa, .h3 .fas { color: #1D4ED8; }

  /* Tableau de bord : tuiles blanches, couleur réservée aux statuts */
  .clickable-card:not(.carte-couleur) > .fk-card-header { background: transparent !important; padding-bottom: .25rem !important; }
  :root:not([data-bs-theme="dark"]) .clickable-card:not(.carte-couleur) > .fk-card-header { background: #FFFFFF !important; }
  .clickable-card:not(.carte-couleur) > .fk-card-header h6 { color: #475467 !important; text-transform: none; letter-spacing: 0; font-weight: 600; }
  .clickable-card:not(.carte-couleur) > .fk-card-header h2 { color: #0F172A !important; }
  :root[data-bs-theme="dark"] .clickable-card:not(.carte-couleur) > .fk-card-header h2 { color: #F8FAFC !important; }
  .clickable-card:not(.carte-couleur) > .fk-card-header .text-white-90, .clickable-card:not(.carte-couleur) > .fk-card-header small { color: #475467 !important; }
  .clickable-card:not(.carte-couleur) > .fk-card-header .icon-circle { background: #EEF4FF !important; }
  .clickable-card:not(.carte-couleur) > .fk-card-header .icon-circle i { color: #1D4ED8 !important; }
  .clickable-card:not(.carte-couleur) .fk-card-body > .d-flex.justify-content-between.mb-1,
  .clickable-card:not(.carte-couleur) .fk-card-body > .progress { display: none !important; }
  .clickable-card:not(.carte-couleur) .fk-card-body > .mt-3 { margin-top: 0 !important; }
  .clickable-card:not(.carte-couleur) .fk-card-body .badge, .clickable-card:not(.carte-couleur) .fk-card-body .fk-badge { background: #F2F4F7 !important; color: #344054 !important; }

  /* Pastilles et boutons : à plat */
  .fk-badge-danger { background: #FEE4E2 !important; color: #912018 !important; }
  .bg-gradient-info, .bg-gradient-primary { background: #1D4ED8 !important; }
  .fk-btn-primary, .btn-primary { background: #1D4ED8 !important; border-color: #1D4ED8 !important; box-shadow: none !important; }
  .fk-btn-outline { border-radius: 8px !important; }

  /* Pages « modernes » (tableau de bord de l'administrateur du client, etc.) : mêmes règles.
     html:root l'emporte sur les variables que ces pages redéfinissent dans leur propre <style>. */
  html:root {
    --primary-blue: #13294B; --primary-blue-light: #1D4ED8; --gold: #1D4ED8; --gold-light: #3B82F6;
    --shadow: none; --shadow-hover: 0 1px 2px rgba(16, 24, 40, .05); --radius: 12px; --radius-sm: 8px;
  }
  h1[style*="Georgia"], .card-stat .stat-value { font-family: inherit !important; letter-spacing: -.01em; }
  .card-stat, .card-modern { box-shadow: none !important; }
  .card-stat:hover, .card-modern:hover, .card-stat:hover .stat-icon, .badge-modern:hover { transform: none !important; }
  .card-stat .stat-label { text-transform: none !important; letter-spacing: 0 !important; font-size: .82rem !important; color: #475467 !important; }
  .card-stat .stat-icon { border-radius: 10px !important; }
  .card-stat .stat-icon.primary, .card-stat .stat-icon.info, .card-stat .stat-icon.purple,
  .card-stat .stat-icon.gold, .card-stat .stat-icon.success { background: #EEF4FF !important; color: #1D4ED8 !important; }
  .btn-modern-primary, .btn-modern-gold, [data-bs-theme="dark"] .btn-modern-primary, [data-bs-theme="dark"] .btn-modern-gold {
    background: #1D4ED8 !important; color: #FFFFFF !important; box-shadow: none !important; border: 0 !important; }
  .progress-bar.bg-primary { background: #1D4ED8 !important; }
  .progress-bar.bg-success { background: #12B76A !important; }
  .progress-bar.bg-warning { background: #F79009 !important; }
  .progress-bar.bg-danger { background: #F04438 !important; }
  .card-modern .card-header { border-bottom: 1px solid #E4E7EC !important; }

  /* Menu latéral : toujours ouvert avec les libellés, fond blanc (ordinateur uniquement) */
  @media (min-width: 992px) {
    .sidebar-compact { display: none !important; }
    #sidebarExpanded, #sidebarExpanded.hidden { display: flex !important; width: 248px !important; }
    .main-content, .app-footer, body.sidebar-is-expanded .main-content, body.sidebar-is-expanded .app-footer { margin-left: 248px !important; }
    #closeSidebar { display: none !important; }
  }
  :root:not([data-bs-theme="dark"]) .sidebar-expanded { background: #FFFFFF !important; border-right: 1px solid #E4E7EC !important; box-shadow: none !important; }
  :root:not([data-bs-theme="dark"]) .sidebar-expanded h6, :root:not([data-bs-theme="dark"]) .sidebar-expanded .text-white { color: #0F172A !important; }
  :root:not([data-bs-theme="dark"]) .sidebar-expanded .text-white-50 { color: #667085 !important; }
  :root:not([data-bs-theme="dark"]) .sidebar-heading { color: #667085 !important; border-bottom: 0 !important; padding: .5rem .75rem .25rem !important; margin-bottom: .25rem !important; letter-spacing: .06em; }
  :root:not([data-bs-theme="dark"]) .sidebar-menu-expanded .nav-link { color: #344054 !important; padding: .5rem .75rem !important; gap: .75rem !important; font-size: .92rem !important; }
  :root:not([data-bs-theme="dark"]) .sidebar-menu-expanded .nav-link:hover { background: #F2F4F7 !important; color: #0F172A !important; transform: none !important; border-color: transparent !important; }
  :root:not([data-bs-theme="dark"]) .sidebar-menu-expanded .nav-link.active { background: #EEF4FF !important; color: #1D4ED8 !important; box-shadow: none !important; font-weight: 600; }
  :root:not([data-bs-theme="dark"]) .sidebar-icon { color: #98A2B3 !important; }
  :root:not([data-bs-theme="dark"]) .sidebar-menu-expanded .nav-link.active .sidebar-icon,
  :root:not([data-bs-theme="dark"]) .sidebar-menu-expanded .nav-link:hover .sidebar-icon { color: #1D4ED8 !important; }
  .sidebar-section { margin-bottom: 1rem !important; }
  :root:not([data-bs-theme="dark"]) .sidebar-footer { background: #F9FAFB !important; border-top: 1px solid #E4E7EC !important; }
  :root:not([data-bs-theme="dark"]) .sidebar-footer .nav-link { color: #344054 !important; }
  :root:not([data-bs-theme="dark"]) .sidebar-footer .nav-link:hover { background: #F2F4F7 !important; color: #0F172A !important; }
  .sidebar-menu-expanded .rg-bouton kbd { background: #F2F4F7; color: #475467; border: 1px solid #E4E7EC; }

  /* Bloc « À traiter » mis en avant */
  #aTraiter { border: 1px solid #C7D7FE !important; }
</style>
{% endif %}
