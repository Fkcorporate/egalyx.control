{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>
            <i class="fas fa-landmark me-2"></i>
            {% if organisme %}Modifier{% else %}Nouvel{% endif %} organisme
        </h2>
        <a href="{{ url_for('liste_organismes') }}" class="btn btn-secondary">
            <i class="fas fa-arrow-left me-2"></i>Retour
        </a>
    </div>
    
    <div class="card">
        <div class="card-body">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Code *</label>
                        <input type="text" name="code" class="form-control" required
                               value="{{ organisme.code if organisme else '' }}"
                               placeholder="AMF, ACPR, CNIL...">
                    </div>
                    <div class="col-md-8">
                        <label class="form-label">Nom *</label>
                        <input type="text" name="nom" class="form-control" required
                               value="{{ organisme.nom if organisme else '' }}">
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">Nom complet</label>
                        <input type="text" name="nom_complet" class="form-control"
                               value="{{ organisme.nom_complet if organisme else '' }}">
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="3">{{ organisme.description if organisme else '' }}</textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Site web</label>
                        <input type="url" name="site_web" class="form-control"
                               value="{{ organisme.site_web if organisme else '' }}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Pays</label>
                        <input type="text" name="pays" class="form-control"
                               value="{{ organisme.pays if organisme else '' }}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Type</label>
                        <select name="type_organisme" class="form-select">
                            <option value="national" {% if organisme and organisme.type_organisme == 'national' %}selected{% endif %}>National</option>
                            <option value="europeen" {% if organisme and organisme.type_organisme == 'europeen' %}selected{% endif %}>Européen</option>
                            <option value="international" {% if organisme and organisme.type_organisme == 'international' %}selected{% endif %}>International</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email contact</label>
                        <input type="email" name="email_contact" class="form-control"
                               value="{{ organisme.email_contact if organisme else '' }}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Téléphone</label>
                        <input type="tel" name="telephone" class="form-control"
                               value="{{ organisme.telephone if organisme else '' }}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Couleur</label>
                        <input type="color" name="couleur" class="form-control form-control-color"
                               value="{{ organisme.couleur if organisme else '#3b82f6' }}">
                    </div>
                </div>
                
                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary-custom">
                        <i class="fas fa-save me-2"></i>Enregistrer
                    </button>
                    <a href="{{ url_for('liste_organismes') }}" class="btn btn-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
