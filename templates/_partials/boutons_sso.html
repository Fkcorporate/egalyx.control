{#- Boutons de connexion unique : affichés seulement si un fournisseur est configuré (egalyx/sso.py). -#}
{% set _sso = sso_fournisseurs() if sso_fournisseurs is defined else [] %}
{% if _sso %}
<div class="sso-zone" style="margin-top: 1rem;">
  <div style="display: flex; align-items: center; gap: .75rem; color: #6b7280; font-size: .8rem; margin: .5rem 0 .75rem;">
    <span style="flex: 1; height: 1px; background: #e5e7eb;"></span>ou<span style="flex: 1; height: 1px; background: #e5e7eb;"></span>
  </div>
  {% for f in _sso %}
  <a href="{{ url_for('sso.demarrer', fournisseur=f.code, next=request.args.get('next')) }}"
     style="display: flex; align-items: center; justify-content: center; gap: .5rem; width: 100%; margin-bottom: .5rem;
            padding: .65rem 1rem; border: 1px solid #d1d5db; border-radius: 10px; background: #fff; color: #1f2937;
            font-weight: 600; text-decoration: none;">
    <i class="{{ f.icone }}"></i> Continuer avec {{ f.nom }}
  </a>
  {% endfor %}
</div>
{% endif %}
