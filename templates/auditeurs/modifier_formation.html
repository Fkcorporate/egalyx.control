{% extends "base.html" %}

{% block title %}Modifier - {{ formation.titre }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0">
                        <i class="fas fa-edit me-2"></i>
                        Modifier la formation
                    </h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        
                        <div class="mb-3">
                            <label class="form-label">Titre *</label>
                            <input type="text" class="form-control" name="titre" value="{{ formation.titre }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" name="description" rows="3">{{ formation.description or '' }}</textarea>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Type</label>
                                <select class="form-select" name="type_formation">
                                    <option value="interne" {% if formation.type_formation == 'interne' %}selected{% endif %}>🏢 Interne</option>
                                    <option value="externe" {% if formation.type_formation == 'externe' %}selected{% endif %}>🌍 Externe</option>
                                    <option value="e-learning" {% if formation.type_formation == 'e-learning' %}selected{% endif %}>💻 E-learning</option>
                                    <option value="certification" {% if formation.type_formation == 'certification' %}selected{% endif %}>🎓 Certification</option>
                                    <option value="atelier" {% if formation.type_formation == 'atelier' %}selected{% endif %}>🤝 Atelier</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Durée (heures)</label>
                                <input type="number" class="form-control" name="duree_heures" step="0.5" value="{{ formation.duree_heures or '' }}">
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Date début</label>
                                <input type="date" class="form-control" name="date_debut" value="{{ formation.date_debut.strftime('%Y-%m-%d') if formation.date_debut else '' }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Date fin</label>
                                <input type="date" class="form-control" name="date_fin" value="{{ formation.date_fin.strftime('%Y-%m-%d') if formation.date_fin else '' }}">
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Coût (€)</label>
                                <input type="number" class="form-control" name="cout" step="0.01" value="{{ formation.cout or '' }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Formateur</label>
                                <input type="text" class="form-control" name="formateur" value="{{ formation.formateur or '' }}">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Objectifs</label>
                            <textarea class="form-control" name="objectifs" rows="3">{{ formation.objectifs or '' }}</textarea>
                        </div>
                        
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{{ url_for('liste_formations') }}" class="btn btn-secondary">Annuler</a>
                            <button type="submit" class="btn btn-warning">Modifier</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
